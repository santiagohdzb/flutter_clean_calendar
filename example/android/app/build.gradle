plugins {
    id "com.android.application"
    // Note: We don't add versions here; they are managed in settings.gradle
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    // 1. This is the "Namespace" fix. Replace with your actual package name.
    namespace "com.example.example" 
    
    // 2. Flutter 3.38+ works best with 34 or 35
    compileSdk 34

    defaultConfig {
        applicationId "com.example.example"
        minSdk 24 // Flutter 3.38 minimum recommendation
        targetSdk 35
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    // Modern AndroidX testing libraries
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
